
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>ICSearch</title>
    <link rel="stylesheet" href="static/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Saira:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<body>
    <main>
        <div class="logo">IC<span>Search</span></div>
        <div class="search-container">
            <form class="search-form" action="results" method="GET">
                <input
                    type="text"
                    name="q"
                    placeholder="What are you looking for?"
                    autocomplete="on"
                    required
                >
                <button type="submit">
                    <img src="static/search.svg" alt="Search icon" width="20" height="20">
                </button>
            </form>
        </div>
    </main>

    <footer>
        ICSearch
    </footer>

</body>
</html>
